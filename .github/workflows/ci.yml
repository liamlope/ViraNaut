name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: viranaut_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, pdo_mysql, curl, json, mbstring
          coverage: none

      - name: Prepare config for CI
        run: cp config.sample.php config.php

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Smoke test
        run: php tools/smoke_test.php

      - name: PHPUnit
        run: vendor/bin/phpunit --no-coverage
